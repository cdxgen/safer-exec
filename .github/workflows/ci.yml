name: Build & Test

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  build-go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: windows
            arch: amd64
            runner: ubuntu-latest
          - os: windows
            arch: arm64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.26"
          cache: false

      - name: Cross-compile ${{ matrix.os }}-${{ matrix.arch }}
        run: |
          cd go
          # CGO_ENABLED=0 required: cilium/ebpf is pure Go; static build works on both glibc and musl.
          # -extldflags are Linux-only hardening flags; omit for darwin cross-compile to avoid linker warnings.
          ext=""
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            ext=".exe"
          fi
          if [[ "${{ matrix.os }}" == "linux" || "${{ matrix.os }}" == "windows" ]]; then
            CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build \
              -trimpath -ldflags="-s -w" \
              -o bin/safer-exec-rt-${{ matrix.os }}-${{ matrix.arch }}${ext} ./cmd/safer-exec/
          else
            CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build \
              -ldflags="-s -w" \
              -o bin/safer-exec-rt-${{ matrix.os }}-${{ matrix.arch }} ./cmd/safer-exec/
          fi

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: safer-exec-rt-${{ matrix.os }}-${{ matrix.arch }}
          path: go/bin/safer-exec-rt-${{ matrix.os }}-${{ matrix.arch }}*

  # The Windows engine drives the Microsoft eXecution Container executor,
  # built here from the commit pinned in .github/scripts/build-mxc.ps1. The
  # build output is cached under a key derived from that script, so it is
  # rebuilt only when the pin or the build steps change.
  build-mxc:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            mxc-arch: x64
            runner: windows-2025
          - arch: arm64
            mxc-arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Restore MXC build
        id: mxc-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: mxc-bin
          key: mxc-${{ matrix.mxc-arch }}-${{ hashFiles('.github/scripts/build-mxc.ps1') }}

      - name: Build wxc-exec.exe
        if: steps.mxc-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./.github/scripts/build-mxc.ps1 -Arch ${{ matrix.mxc-arch }} -OutDir mxc-bin

      - name: Upload MXC executor
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mxc-windows-${{ matrix.arch }}
          path: mxc-bin/
          if-no-files-found: error

  test-go-windows:
    needs: [build-mxc]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.26"
          cache: false

      - name: Download MXC executor
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: mxc-windows-${{ matrix.arch }}
          path: mxc-bin

      # The probe reports which containment tier this runner image offers;
      # Windows Server images are outside MXC's supported list and usually
      # lack the BaseContainer API.
      - name: MXC host probe
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./mxc-bin/wxc-exec.exe --probe

      # The engine integration tests skip themselves unless the probe reports
      # the BaseContainer tier; the translation, quoting and job-object tests
      # always run. $PSNativeCommandUseErrorActionPreference makes a failing
      # go vet stop the step (pwsh otherwise reports only the last command).
      - name: Run Go tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:SAFER_EXEC_MXC_EXEC = (Resolve-Path mxc-bin/wxc-exec.exe).Path
          cd go
          go vet ./...
          go test -v ./...

  check-bpf-objects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Verify BPF .o files are committed
        run: |
          for f in \
            go/internal/httptrace/bpf/ssl_trace_linux_amd64.o \
            go/internal/httptrace/bpf/ssl_trace_linux_arm64.o; do
            if [[ ! -s "$f" ]]; then
              echo "ERROR: $f is missing or empty. Run go/internal/httptrace/bpf/compile.sh to regenerate."
              exit 1
            fi
            echo "OK: $f ($(wc -c < "$f") bytes)"
          done

  test-go:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['macos-15', 'ubuntu-22.04', 'ubuntu-22.04-arm', 'ubuntu-24.04', 'ubuntu-24.04-arm', 'macos-15-intel']
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.26"
          cache: false

      - name: Build Go binary (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: |
          cd go
          go build -trimpath -ldflags="-s -w" -o bin/safer-exec-rt ./cmd/safer-exec/

      - name: Load AppArmor profile for user namespaces (Linux)
        if: contains(matrix.os, 'ubuntu-24.04')
        run: sudo node npm/src/cli.js bootstrap-apparmor

      - name: Run Go tests
        run: |
          cd go
          go test ./...

      - name: Verify --trace-http-urls graceful degradation (no CAP_BPF on runner)
        if: contains(matrix.os, 'ubuntu')
        run: |
          cd go
          CGO_ENABLED=0 go build -o /tmp/safer-exec-rt-test ./cmd/safer-exec/
          # The Go binary reads JSON config from stdin; CLI flags belong to the npm wrapper.
          # Without CAP_BPF the eBPF warning is emitted but the process must exit 0.
          output=$(echo '{"cmd":"/bin/echo","args":["http-trace-graceful-degradation-ok"],"traceHTTPURLs":true}' \
            | /tmp/safer-exec-rt-test 2>&1) || true
          echo "$output"
          # Fail only if the eBPF layer emitted a fatal (non-warning) error.
          if echo "$output" | grep -q "safer-exec: http-trace:" && \
             ! echo "$output" | grep -q "safer-exec: warning: http-trace:"; then
            echo "ERROR: eBPF tracer emitted a fatal error instead of a graceful warning"
            exit 1
          fi
          echo "Graceful degradation verified."

  test-node:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "25", "26"]
        os: ['macos-15', 'ubuntu-22.04', 'ubuntu-22.04-arm', 'ubuntu-24.04', 'ubuntu-24.04-arm', 'macos-15-intel']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.26"
          cache: false

      - name: Build Go binary
        run: |
          cd go
          go build -trimpath -ldflags="-s -w" -o bin/safer-exec-rt ./cmd/safer-exec/

      - name: Load AppArmor profile for user namespaces (Linux)
        if: contains(matrix.os, 'ubuntu-24.04')
        run: sudo node npm/src/cli.js bootstrap-apparmor

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install dependencies
        run: |
          cd npm
          npm install
      - name: Run diagnostics
        run: |
          cd npm
          node src/cli.js diagnostics
      - name: Run unit tests
        run: |
          cd npm
          npm run test:unit
      - name: Run integration tests
        run: |
          cd npm
          npm run test:integration
      - name: Run HTTP tracing diagnostics
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo env "PATH=$PATH" node tests/debug_httptrace.js
      - name: Run HTTP tracing integration tests
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          cd npm
          sudo env "PATH=$PATH" node --test ../tests/httptrace.test.js
      - name: Run security and exhaustion tests
        run: |
          cd npm
          npm run test:security test:exhaustion

  test-node-windows:
    needs: [build-mxc]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.26"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download MXC executor
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: mxc-windows-${{ matrix.arch }}
          path: mxc-bin

      - name: Build Go engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cd go
          go build -trimpath -ldflags="-s -w" -o bin/safer-exec-rt.exe ./cmd/safer-exec/
          Copy-Item ../mxc-bin/wxc-exec.exe bin/

      - name: Run diagnostics
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cd npm
          node src/cli.js diagnostics

      # Most Node suites run POSIX tools (echo, sh -c, id) or assert POSIX
      # paths, and the built-in ecosystem policies are written for macOS and
      # Linux. Windows runs the suites that are platform-neutral plus
      # windows.test.js, which exercises the engine end to end with Windows
      # tools; the rest run on the Linux and macOS jobs above.
      - name: Run portable unit and Windows end-to-end tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cd npm
          node --test src/windows.test.js src/crypto.test.js src/env.test.js src/hardening.test.js src/net.test.js

  publish:
    needs: [build-go, build-mxc, check-bpf-objects, test-go, test-go-windows, test-node, test-node-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: safer-exec-rt-*
          path: binaries/

      - name: Download MXC executors
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: mxc-windows-*
          path: mxc/

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      # Every package is staged before anything is published, and a package
      # whose version is already on the registry is skipped, so a run that
      # stops partway (for example, a new package without a trusted
      # publisher configured yet) can be re-run without "version exists"
      # failures. New package names need a first manual publish and a
      # trusted-publisher entry on npmjs.com before OIDC publishing works;
      # .github/scripts/npm-bootstrap does both.
      - name: Publish packages
        run: |
          set -euo pipefail
          # Extract version from npm/package.json
          version=$(jq -r '.version' npm/package.json)

          # Determine dry-run options
          publish_opts=(--provenance --access public)
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v ]]; then
            echo "Non-tag execution: running npm publish in dry-run mode"
            publish_opts=(--dry-run --access public)
          fi

          publish() {
            local dir=$1 name
            name=$(jq -r '.name' "$dir/package.json")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published; skipping"
              return
            fi
            (cd "$dir" && npm publish "${publish_opts[@]}")
          }

          # Stage each binary as its own npm package
          staged=()
          for binary in binaries/safer-exec-rt-*/safer-exec-rt-*; do
            binary_name=$(basename "$binary" .exe)
            platform=$(echo "$binary_name" | cut -d- -f4,5)
            pkg_name="@cdxgen/safer-exec-${platform}"
            os_name=$(echo "$platform" | cut -d- -f1)
            case "$platform" in
              *-arm64) cpu="arm64" ;;
              *) cpu="x64" ;;
            esac
            main="bin/safer-exec-rt"
            mkdir -p "publish-${platform}/bin"
            if [[ "$os_name" == "windows" ]]; then
              # npm names the platform win32. The engine finds the MXC
              # executor next to itself.
              os_name="win32"
              main="bin/safer-exec-rt.exe"
              cp "$binary" "publish-${platform}/${main}"
              cp mxc/mxc-${platform}/wxc-exec.exe mxc/mxc-${platform}/MXC-LICENSE.md mxc/mxc-${platform}/MXC-VERSION \
                mxc/mxc-${platform}/MXC-THIRD-PARTY.md "publish-${platform}/bin/"
            else
              cp "$binary" "publish-${platform}/${main}"
            fi
            jq -n \
              --arg name "$pkg_name" \
              --arg version "$version" \
              --arg os "$os_name" \
              --arg cpu "$cpu" \
              --arg main "$main" \
              '{
                name: $name,
                version: $version,
                main: $main,
                files: ["bin/"],
                license: "MIT",
                repository: {
                  type: "git",
                  url: "git+https://github.com/cdxgen/safer-exec.git"
                },
                bugs: {
                  url: "https://github.com/cdxgen/cdxgen/issues"
                },
                homepage: "https://github.com/cdxgen/safer-exec#readme",
                os: [$os],
                cpu: [$cpu]
              }' > "publish-${platform}/package.json"
            staged+=("publish-${platform}")
          done
          for dir in "${staged[@]}"; do
            publish "$dir"
          done
          publish npm
