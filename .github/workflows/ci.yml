name: Build & Test

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  build-go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.26"
          cache: false

      - name: Cross-compile ${{ matrix.os }}-${{ matrix.arch }}
        run: |
          cd go
          # CGO_ENABLED=0 required: cilium/ebpf is pure Go; static build works on both glibc and musl.
          # -extldflags are Linux-only hardening flags; omit for darwin cross-compile to avoid linker warnings.
          if [[ "${{ matrix.os }}" == "linux" ]]; then
            CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build \
              -trimpath -ldflags="-s -w" \
              -o bin/safer-exec-rt-${{ matrix.os }}-${{ matrix.arch }} ./cmd/safer-exec/
          else
            CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build \
              -ldflags="-s -w" \
              -o bin/safer-exec-rt-${{ matrix.os }}-${{ matrix.arch }} ./cmd/safer-exec/
          fi

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: safer-exec-rt-${{ matrix.os }}-${{ matrix.arch }}
          path: go/bin/safer-exec-rt-${{ matrix.os }}-${{ matrix.arch }}

  check-bpf-objects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Verify BPF .o files are committed
        run: |
          for f in \
            go/internal/httptrace/bpf/ssl_trace_linux_amd64.o \
            go/internal/httptrace/bpf/ssl_trace_linux_arm64.o; do
            if [[ ! -s "$f" ]]; then
              echo "ERROR: $f is missing or empty. Run go/internal/httptrace/bpf/compile.sh to regenerate."
              exit 1
            fi
            echo "OK: $f ($(wc -c < "$f") bytes)"
          done

  test-go:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['macos-15', 'ubuntu-22.04', 'ubuntu-22.04-arm', 'ubuntu-24.04', 'ubuntu-24.04-arm', 'macos-15-intel']
      fail-fast: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.26"
          cache: false

      - name: Build Go binary (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: |
          cd go
          go build -trimpath -ldflags="-s -w" -o bin/safer-exec-rt ./cmd/safer-exec/

      - name: Load AppArmor profile for user namespaces (Linux)
        if: contains(matrix.os, 'ubuntu-24.04')
        run: |
          sudo tee /etc/apparmor.d/safer-exec-test <<EOF
          abi <abi/4.0>,
          include <tunables/global>

          profile safer-exec-rt ${{ github.workspace }}/go/bin/safer-exec-rt flags=(unconfined) {
            userns,
          }
          
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/safer-exec-test

      - name: setcap
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo setcap 'cap_sys_resource,cap_bpf,cap_perfmon,cap_sys_ptrace,cap_sys_admin+eip' ${{ github.workspace }}/go/bin/safer-exec-rt

      - name: Run Go tests
        run: |
          cd go
          go test ./...

      - name: Verify --trace-http-urls graceful degradation (no CAP_BPF on runner)
        if: contains(matrix.os, 'ubuntu')
        run: |
          cd go
          CGO_ENABLED=0 go build -o /tmp/safer-exec-rt-test ./cmd/safer-exec/
          # The Go binary reads JSON config from stdin; CLI flags belong to the npm wrapper.
          # Without CAP_BPF the eBPF warning is emitted but the process must exit 0.
          output=$(echo '{"cmd":"/bin/echo","args":["http-trace-graceful-degradation-ok"],"traceHTTPURLs":true}' \
            | /tmp/safer-exec-rt-test 2>&1) || true
          echo "$output"
          # Fail only if the eBPF layer emitted a fatal (non-warning) error.
          if echo "$output" | grep -q "safer-exec: http-trace:" && \
             ! echo "$output" | grep -q "safer-exec: warning: http-trace:"; then
            echo "ERROR: eBPF tracer emitted a fatal error instead of a graceful warning"
            exit 1
          fi
          echo "Graceful degradation verified."

  test-node:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "23", "24", "25", "26"]
        os: ['macos-15', 'ubuntu-22.04', 'ubuntu-22.04-arm', 'ubuntu-24.04', 'ubuntu-24.04-arm', 'macos-15-intel']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.26"
          cache: false

      - name: Build Go binary
        run: |
          cd go
          go build -trimpath -ldflags="-s -w" -o bin/safer-exec-rt ./cmd/safer-exec/

      - name: Load AppArmor profile for user namespaces (Linux)
        if: contains(matrix.os, 'ubuntu-24.04')
        run: |
          sudo tee /etc/apparmor.d/safer-exec-test <<EOF
          abi <abi/4.0>,
          include <tunables/global>

          profile safer-exec-rt ${{ github.workspace }}/go/bin/safer-exec-rt flags=(unconfined) {
            userns,
          }
          
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/safer-exec-test

      - name: setcap
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo setcap 'cap_sys_resource,cap_bpf,cap_perfmon,cap_sys_ptrace,cap_sys_admin+eip' ${{ github.workspace }}/go/bin/safer-exec-rt

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install dependencies
        run: |
          cd npm
          npm install
      - name: Run diagnostics
        run: |
          cd npm
          node src/cli.js diagnostics
      - name: Run unit tests
        run: |
          cd npm
          npm run test:unit
      - name: Run integration tests
        run: |
          cd npm
          npm run test:integration
      - name: Run HTTP tracing diagnostics
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo env "PATH=$PATH" node tests/debug_httptrace.js
      - name: Run HTTP tracing integration tests
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          cd npm
          sudo env "PATH=$PATH" node --test ../tests/httptrace.test.js
      - name: Run security and exhaustion tests
        run: |
          cd npm
          npm run test:security test:exhaustion

  publish:
    needs: [build-go, check-bpf-objects, test-go, test-node]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: safer-exec-rt-*
          path: binaries/

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Publish packages
        run: |
          # Extract version from npm/package.json
          version=$(jq -r '.version' npm/package.json)

          # Determine dry-run options
          publish_opts=(--provenance --access public)
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v ]]; then
            echo "Non-tag execution: running npm publish in dry-run mode"
            publish_opts=(--dry-run --access public)
          fi

          # Package each binary into its own npm package
          for binary in binaries/safer-exec-rt-*/safer-exec-rt-*; do
            binary_name=$(basename "$binary")
            platform=$(echo "$binary_name" | cut -d- -f4,5)
            pkg_name="@cdxgen/safer-exec-${platform}"
            os_name=$(echo "$platform" | cut -d- -f1)
            case "$platform" in
              *-arm64) cpu="arm64" ;;
              *) cpu="x64" ;;
            esac
            mkdir -p "publish-${platform}/bin"
            cp "$binary" "publish-${platform}/bin/safer-exec-rt"
            jq -n \
              --arg name "$pkg_name" \
              --arg version "$version" \
              --arg os "$os_name" \
              --arg cpu "$cpu" \
              '{
                name: $name,
                version: $version,
                main: "bin/safer-exec-rt",
                files: ["bin/"],
                license: "MIT",
                repository: {
                  type: "git",
                  url: "git+https://github.com/cdxgen/safer-exec.git"
                },
                bugs: {
                  url: "https://github.com/cdxgen/cdxgen/issues"
                },
                homepage: "https://github.com/cdxgen/safer-exec#readme",
                os: [$os],
                cpu: [$cpu]
              }' > "publish-${platform}/package.json"
            cd "publish-${platform}"
            npm publish "${publish_opts[@]}"
            cd ..
          done
          cd npm
          npm publish "${publish_opts[@]}"
