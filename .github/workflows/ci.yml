name: Build & Test

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  build-go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: windows
            arch: amd64
            runner: ubuntu-latest
          - os: windows
            arch: arm64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.26"
          cache: false

      - name: Cross-compile ${{ matrix.os }}-${{ matrix.arch }}
        run: |
          cd go
          # CGO_ENABLED=0 required: cilium/ebpf is pure Go; static build works on both glibc and musl.
          # -extldflags are Linux-only hardening flags; omit for darwin cross-compile to avoid linker warnings.
          ext=""
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            ext=".exe"
          fi
          if [[ "${{ matrix.os }}" == "linux" || "${{ matrix.os }}" == "windows" ]]; then
            CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build \
              -trimpath -ldflags="-s -w" \
              -o bin/safer-exec-rt-${{ matrix.os }}-${{ matrix.arch }}${ext} ./cmd/safer-exec/
          else
            CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build \
              -ldflags="-s -w" \
              -o bin/safer-exec-rt-${{ matrix.os }}-${{ matrix.arch }} ./cmd/safer-exec/
          fi

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: safer-exec-rt-${{ matrix.os }}-${{ matrix.arch }}
          path: go/bin/safer-exec-rt-${{ matrix.os }}-${{ matrix.arch }}*

  # The Windows engine drives the Microsoft eXecution Container executor,
  # built here from the commit pinned in .github/scripts/build-mxc.ps1.
  build-mxc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            mxc-arch: x64
            runner: windows-2025
          - arch: arm64
            mxc-arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Build wxc-exec.exe
        shell: pwsh
        run: ./.github/scripts/build-mxc.ps1 -Arch ${{ matrix.mxc-arch }} -OutDir mxc-bin

      - name: Upload MXC executor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mxc-windows-${{ matrix.arch }}
          path: mxc-bin/
          if-no-files-found: error

  test-go-windows:
    needs: [build-mxc]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.26"
          cache: false

      - name: Download MXC executor
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: mxc-windows-${{ matrix.arch }}
          path: mxc-bin

      - name: MXC host probe
        shell: pwsh
        run: ./mxc-bin/wxc-exec.exe --probe

      # The engine integration tests skip themselves when the runner image
      # lacks the BaseContainer API; the translation and job-object tests
      # always run.
      - name: Run Go tests
        shell: pwsh
        run: |
          $env:SAFER_EXEC_MXC_EXEC = (Resolve-Path mxc-bin/wxc-exec.exe).Path
          cd go
          go vet ./...
          go test -v ./...

  check-bpf-objects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Verify BPF .o files are committed
        run: |
          for f in \
            go/internal/httptrace/bpf/ssl_trace_linux_amd64.o \
            go/internal/httptrace/bpf/ssl_trace_linux_arm64.o; do
            if [[ ! -s "$f" ]]; then
              echo "ERROR: $f is missing or empty. Run go/internal/httptrace/bpf/compile.sh to regenerate."
              exit 1
            fi
            echo "OK: $f ($(wc -c < "$f") bytes)"
          done

  test-go:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['macos-15', 'ubuntu-22.04', 'ubuntu-22.04-arm', 'ubuntu-24.04', 'ubuntu-24.04-arm', 'macos-15-intel']
      fail-fast: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.26"
          cache: false

      - name: Build Go binary (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: |
          cd go
          go build -trimpath -ldflags="-s -w" -o bin/safer-exec-rt ./cmd/safer-exec/

      - name: Load AppArmor profile for user namespaces (Linux)
        if: contains(matrix.os, 'ubuntu-24.04')
        run: sudo node npm/src/cli.js bootstrap-apparmor

      - name: Run Go tests
        run: |
          cd go
          go test ./...

      - name: Verify --trace-http-urls graceful degradation (no CAP_BPF on runner)
        if: contains(matrix.os, 'ubuntu')
        run: |
          cd go
          CGO_ENABLED=0 go build -o /tmp/safer-exec-rt-test ./cmd/safer-exec/
          # The Go binary reads JSON config from stdin; CLI flags belong to the npm wrapper.
          # Without CAP_BPF the eBPF warning is emitted but the process must exit 0.
          output=$(echo '{"cmd":"/bin/echo","args":["http-trace-graceful-degradation-ok"],"traceHTTPURLs":true}' \
            | /tmp/safer-exec-rt-test 2>&1) || true
          echo "$output"
          # Fail only if the eBPF layer emitted a fatal (non-warning) error.
          if echo "$output" | grep -q "safer-exec: http-trace:" && \
             ! echo "$output" | grep -q "safer-exec: warning: http-trace:"; then
            echo "ERROR: eBPF tracer emitted a fatal error instead of a graceful warning"
            exit 1
          fi
          echo "Graceful degradation verified."

  test-node:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "25", "26"]
        os: ['macos-15', 'ubuntu-22.04', 'ubuntu-22.04-arm', 'ubuntu-24.04', 'ubuntu-24.04-arm', 'macos-15-intel']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.26"
          cache: false

      - name: Build Go binary
        run: |
          cd go
          go build -trimpath -ldflags="-s -w" -o bin/safer-exec-rt ./cmd/safer-exec/

      - name: Load AppArmor profile for user namespaces (Linux)
        if: contains(matrix.os, 'ubuntu-24.04')
        run: sudo node npm/src/cli.js bootstrap-apparmor

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install dependencies
        run: |
          cd npm
          npm install
      - name: Run diagnostics
        run: |
          cd npm
          node src/cli.js diagnostics
      - name: Run unit tests
        run: |
          cd npm
          npm run test:unit
      - name: Run integration tests
        run: |
          cd npm
          npm run test:integration
      - name: Run HTTP tracing diagnostics
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo env "PATH=$PATH" node tests/debug_httptrace.js
      - name: Run HTTP tracing integration tests
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          cd npm
          sudo env "PATH=$PATH" node --test ../tests/httptrace.test.js
      - name: Run security and exhaustion tests
        run: |
          cd npm
          npm run test:security test:exhaustion

  test-node-windows:
    needs: [build-mxc]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.26"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download MXC executor
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: mxc-windows-${{ matrix.arch }}
          path: mxc-bin

      - name: Build Go engine
        shell: pwsh
        run: |
          cd go
          go build -trimpath -ldflags="-s -w" -o bin/safer-exec-rt.exe ./cmd/safer-exec/
          Copy-Item ../mxc-bin/wxc-exec.exe bin/

      - name: Run diagnostics
        shell: pwsh
        run: |
          cd npm
          node src/cli.js diagnostics

      # cli.test.js, fsdiff.test.js and harness.test.js drive POSIX commands
      # (echo, sh -c) and paths; windows.test.js covers the same paths with
      # Windows tools.
      - name: Run unit and Windows end-to-end tests
        shell: pwsh
        run: |
          cd npm
          $tests = Get-ChildItem src -Filter *.test.js -Recurse |
            Where-Object { $_.Name -notin 'cli.test.js', 'fsdiff.test.js', 'harness.test.js' } |
            ForEach-Object { $_.FullName }
          node --test $tests

  publish:
    needs: [build-go, build-mxc, check-bpf-objects, test-go, test-go-windows, test-node, test-node-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: safer-exec-rt-*
          path: binaries/

      - name: Download MXC executors
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: mxc-windows-*
          path: mxc/

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Publish packages
        run: |
          # Extract version from npm/package.json
          version=$(jq -r '.version' npm/package.json)

          # Determine dry-run options
          publish_opts=(--provenance --access public)
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v ]]; then
            echo "Non-tag execution: running npm publish in dry-run mode"
            publish_opts=(--dry-run --access public)
          fi

          # Package each binary into its own npm package
          for binary in binaries/safer-exec-rt-*/safer-exec-rt-*; do
            binary_name=$(basename "$binary" .exe)
            platform=$(echo "$binary_name" | cut -d- -f4,5)
            pkg_name="@cdxgen/safer-exec-${platform}"
            os_name=$(echo "$platform" | cut -d- -f1)
            case "$platform" in
              *-arm64) cpu="arm64" ;;
              *) cpu="x64" ;;
            esac
            main="bin/safer-exec-rt"
            mkdir -p "publish-${platform}/bin"
            if [[ "$os_name" == "windows" ]]; then
              # npm names the platform win32. The engine finds the MXC
              # executor next to itself.
              os_name="win32"
              main="bin/safer-exec-rt.exe"
              cp "$binary" "publish-${platform}/${main}"
              cp mxc/mxc-${platform}/wxc-exec.exe mxc/mxc-${platform}/MXC-LICENSE.md mxc/mxc-${platform}/MXC-VERSION "publish-${platform}/bin/"
            else
              cp "$binary" "publish-${platform}/${main}"
            fi
            jq -n \
              --arg name "$pkg_name" \
              --arg version "$version" \
              --arg os "$os_name" \
              --arg cpu "$cpu" \
              --arg main "$main" \
              '{
                name: $name,
                version: $version,
                main: $main,
                files: ["bin/"],
                license: "MIT",
                repository: {
                  type: "git",
                  url: "git+https://github.com/cdxgen/safer-exec.git"
                },
                bugs: {
                  url: "https://github.com/cdxgen/cdxgen/issues"
                },
                homepage: "https://github.com/cdxgen/safer-exec#readme",
                os: [$os],
                cpu: [$cpu]
              }' > "publish-${platform}/package.json"
            cd "publish-${platform}"
            npm publish "${publish_opts[@]}"
            cd ..
          done
          cd npm
          npm publish "${publish_opts[@]}"
